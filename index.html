<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2b3e50">
    <link id="theme-stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@4.5.2/dist/spacelab/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <div class="container mt-5 flex-grow-1">
        <div class="row justify-content-center align-items-center h-100">
            <div class="col-12 col-md-8 col-lg-6 mt-4">

                <div class="text-center mb-4">
                    <img src="https://files.catbox.moe/gfn9kv.png" alt="Weather Pro Logo" height="60" class="mb-2">
                    <h2 class="font-weight-bold">Weather Pro</h2>
                </div>

                <div class="card mb-4 shadow-sm border-0 d-none" id="currentWeatherCard">
                    <div class="card-body py-5">
                        <div class="row align-items-center">
                            
                            <div class="col-6 text-center border-right">
                                <i class="bi bi-geo-alt display-4 text-danger"></i>
                                <h3 id="lblLocation" class="text-danger mt-2 font-weight-bold"></h3>
                            </div>
                            
                            <div class="col-6 text-center">
                                <h5 class="text-muted font-weight-bold">Current Conditions</h5>
                                <i id="iconWeather" class="display-3 text-secondary my-2"></i>
                                <p id="lblDescription" class="mb-3 font-weight-bold"></p>
                                
                                <hr class="w-75 mx-auto">
                                
                                <div class="d-flex justify-content-center mt-3">
                                    <div class="mx-3">
                                        <i class="bi bi-thermometer-half text-warning h5 mb-0"></i> 
                                        <span id="lblTemp" class="font-weight-bold h5"></span>
                                    </div>
                                    <div class="mx-3">
                                        <i class="bi bi-droplet-fill text-primary h5 mb-0"></i> 
                                        <span id="lblHumidity" class="font-weight-bold h5"></span>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <footer class="bg-white text-center py-4 mt-auto border-top">
        <div class="container">
            <p class="text-muted small mb-1">Weather data is provided courtesy of <a href="https://open-meteo.com/" target="_blank">Open-Meteo API</a>.</p>
            <p class="text-muted small mb-0">Generative AI (Google Gemini) was used to help troubleshoot Javascript fetch requests and format Bootstrap HTML structures.</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(function(registration) {})
            .catch(function(error) {});
        }

        const weatherData = {
            0:  { label: "Sunny", icon: "bi-sun-fill text-warning" },
            1:  { label: "Mainly Clear", icon: "bi-sun text-warning" },
            2:  { label: "Partly Sunny", icon: "bi-cloud-sun text-secondary" },
            3:  { label: "Overcast Clouds", icon: "bi-clouds-fill text-secondary" },
            45: { label: "Foggy", icon: "bi-cloud-fog2-fill text-secondary" },
            48: { label: "Freezing Fog", icon: "bi-cloud-fog2-fill text-secondary" },
            51: { label: "Light Drizzle", icon: "bi-cloud-drizzle-fill text-primary" },
            53: { label: "Drizzle", icon: "bi-cloud-drizzle-fill text-primary" },
            61: { label: "Slight Rain", icon: "bi-cloud-rain-fill text-primary" },
            63: { label: "Rainy", icon: "bi-cloud-rain-heavy-fill text-primary" },
            71: { label: "Light Snow", icon: "bi-cloud-snow-fill text-info" },
            80: { label: "Showers", icon: "bi-cloud-rain-fill text-primary" },
            95: { label: "Thunderstorms", icon: "bi-cloud-lightning-rain-fill text-dark" }
        };

        function getCookevilleWeather() {
            let lat = 36.1628;
            let lon = -85.5016;
            let locationName = "Cookeville";
            let strWeatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code&timezone=auto&temperature_unit=fahrenheit`;

            fetch(strWeatherUrl)
            .then(response => response.json())
            .then(data => {
                document.querySelector('#currentWeatherCard').classList.remove('d-none');

                let intCurrentCode = data.current.weather_code;
                let objCurrentWeather = weatherData[intCurrentCode] || weatherData[3];

                document.querySelector('#lblLocation').innerHTML = locationName;
                document.querySelector('#lblTemp').innerHTML = Math.round(data.current.temperature_2m) + '°';
                document.querySelector('#lblHumidity').innerHTML = Math.round(data.current.relative_humidity_2m) + '%';
                
                document.querySelector('#lblDescription').innerHTML = objCurrentWeather.label;
                document.querySelector('#iconWeather').className = `bi ${objCurrentWeather.icon} display-3 my-2`;
            })
            .catch(error => Swal.fire({icon: 'error', title: 'Weather Data Error'}));
        }

        getCookevilleWeather();
    </script>
</body>
</html>
